tools:
  - class_name: "recipe.retool.retool.CustomSandboxFusionTool"
    config:
      sandbox_fusion_url: "http://127.0.0.1:18080/run_code"
      num_workers: 128
      enable_global_rate_limit: false
      rate_limit: 128
      default_timeout: 8
      default_language: "python"
      memory_limit_mb: 1024
      # Options for the shared Ray execution actor; its loopback SandboxFusion server runs on the same node.
      # Pinned to the CPU head node so code execution never lands on TPU trainer/rollout hosts.
      ray_actor_options:
        resources: {"node:__internal_head__": 0.001}
      type: native

    tool_schema:
      type: "function"
      function:
        name: "code_interpreter"
        description: "A tool for executing code."
        parameters:
          type: "object"
          properties:
            code:
              type: "string"
              description: "The code to execute."
          required: ["code"]
